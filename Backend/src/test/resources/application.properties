spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

app.jwt.secret=test-jwt-secret-at-least-32-characters-long
app.jwt.ttl-seconds=3600
app.admin.token=test-admin-token

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test-password

stripe.secret.key=sk_test_dummy_key_for_unit_tests
stripe.webhook.secret=whsec_dummy_webhook_secret_for_tests
